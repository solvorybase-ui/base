<!doctype html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Solvory Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/review.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

    <span class="brand">Solvory</span>
    <span class="section">Product Review</span>
  </header>
  <main class="page">

  </main>
</body>
</html>
